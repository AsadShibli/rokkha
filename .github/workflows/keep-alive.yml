name: Keep alive

# Render's free web service sleeps after 15 minutes without traffic; a ping every 10 minutes
# keeps the demo warm (one always-on service fits in Render's 750 free hours a month).
# A failed ping fails the run, and GitHub emails the repo owner, so this doubles as an
# uptime alert.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        env:
          URL: ${{ vars.KEEP_ALIVE_URL || 'https://rokkha-api.onrender.com/api/v1/health' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 30 --retry-all-errors --max-time 120 "$URL"
