# Render Blueprint, free plans only: New -> Blueprint -> pick this repo.
# Postgres comes from Neon (free, doesn't expire); set DATABASE_URL in the dashboard.
# The escalation worker runs inside the API process. See docs/DEPLOY.md.
services:
  - type: web
    name: rokkha-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: DATABASE_URL
        sync: false # Neon connection string (postgresql://...?sslmode=require is fine)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rokkha-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false # free key from console.groq.com; enables /gds/ai-draft

  - type: keyvalue
    name: rokkha-redis
    plan: free
    ipAllowList: [] # internal connections only
