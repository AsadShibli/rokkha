services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rokkha
      POSTGRES_PASSWORD: rokkha
      POSTGRES_DB: rokkha
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rokkha -d rokkha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
