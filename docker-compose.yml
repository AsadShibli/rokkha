services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rokkha
      POSTGRES_PASSWORD: rokkha
      POSTGRES_DB: rokkha
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rokkha -d rokkha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://rokkha:rokkha@db:5432/rokkha
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-compose-demo-secret-change-me-0123456789abcdef}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
